services:
  itms-mfa:
    build:
      context: .
      dockerfile: Dockerfile
    image: itms-mfa:latest
    container_name: itms-mfa
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - caddy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  caddy-net:
    external: true
    name: caddy-net
